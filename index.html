<style>
body { margin: 0; }
[hidden] { display: none !important; }
/* Full-screen 3D library. A small brass-and-parchment control bar floats on top; a details panel slides in from the right (bottom sheet on phones). */
:root {

:root[data-theme="dark"] { --ink: #F5E8D2; --parch: #2A1B10; --parch-2: #3A2617; --brass: #D9A64C; --brass-ink: #F1CB80; --muted: #CDB596; --line: #5A3F28; }

html, body { margin: 0; height: 100%; }
body { background: #140A04; color: var(--ink); font-family: var(--body); overflow: hidden; }

canvas { display: block; }

.bar h1 { font-family: var(--display); font-weight: 800; font-size: 1.05rem; margin: 0; letter-spacing: -.01em; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: inherit; font-size: .82rem; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: #2A180D; font-weight: 700; }
.search { font: inherit; font-size: .88rem; flex: 1 1 110px; min-width: 0; border: 1px solid var(--line); background: var(--parch-2); color: var(--ink); border-radius: 8px; padding: 6px 10px; }
.count { font-family: var(--mono); font-size: .78rem; color: var(--muted); white-space: nowrap; }
.btn { font: inherit; font-weight: 700; font-size: .85rem; border: 0; background: var(--brass); color: #2A180D; border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.chip:focus-visible, .btn:focus-visible, .search:focus-visible, .nav button:focus-visible, .x:focus-visible, .used-btn:focus-visible { outline: 3px solid #FFD27A; outline-offset: 2px; }
.nav { position: fixed; z-index: 10; bottom: max(14px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; align-items: center; padding: 6px; border-radius: 999px; background: color-mix(in srgb, var(--parch) 90%, transparent); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.35); }
.nav button { font: inherit; font-size: 1.05rem; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--parch-2); color: var(--ink); cursor: pointer; }
.hint { font-size: .8rem; color: var(--muted); padding: 0 8px; white-space: nowrap; }
@media (max-width: 640px) { .hint { display: none; } .bar h1 { font-size: .95rem; } .bar { padding: 8px 10px; gap: 6px 8px; } .chips { flex-wrap: nowrap; overflow-x: auto; width: 100%; scrollbar-width: none; } .chip { white-space: nowrap; } .count { display: none; } }
.panel { position: fixed; z-index: 20; top: 0; right: 0; height: 100%; width: min(440px, 100vw); background: var(--parch); border-left: 1px solid var(--line); box-shadow: -20px 0 40px rgba(0,0,0,.4); transform: translateX(105%); transition: transform .35s cubic-bezier(.2,.8,.2,1); overflow-y: auto; padding: 22px 22px 40px; display: flex; flex-direction: column; gap: 12px; }
.panel.open { transform: none; }
@media (max-width: 640px) { .panel { top: auto; bottom: 0; height: min(78vh, 680px); width: 100vw; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; transform: translateY(105%); } }
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.x { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--parch-2); color: var(--ink); font-size: 1.2rem; cursor: pointer; }
.panel h2 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.05; margin: 0; padding-right: 44px; }
.ref { font-size: .82rem; font-weight: 700; color: var(--brass-ink); }
.panel p { margin: 0; line-height: 1.5; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: .76rem; font-weight: 700; border-radius: 6px; padding: 2px 8px; background: var(--parch-2); border: 1px solid var(--line); }
.ex { border-left: 3px solid var(--brass); padding-left: 10px; }
.lbl { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; border-block: 1px dashed var(--line); padding-block: 8px; }
.stats div span:last-child { font-family: var(--mono); font-size: .8rem; }
.panel a { color: var(--brass-ink); overflow-wrap: anywhere; }
.used-btn { align-self: flex-start; font: inherit; font-size: .8rem; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.used-btn[aria-pressed="true"] { background: var(--ink); color: var(--parch); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.focus-label { position: fixed; z-index: 11; left: 50%; bottom: 74px; transform: translateX(-50%); background: #FFD27A; color: #2A180D; font-weight: 700; padding: 6px 12px; border-radius: 8px; display: none; }
.btn.ghost { background: transparent; border: 1px solid var(--brass); color: var(--ink); }
.btn.ghost[aria-pressed="true"] { background: var(--ink); color: var(--parch); border-color: var(--ink); }
.list { position: fixed; z-index: 19; top: 0; left: 0; height: 100%; width: min(520px, 100vw); background: var(--parch); border-right: 1px solid var(--line); box-shadow: 20px 0 40px rgba(0,0,0,.4); overflow-y: auto; padding: 18px 18px 90px; }
.list[hidden] { display: none; }
.list-head { position: sticky; top: -18px; background: var(--parch); display: flex; align-items: center; gap: 10px; padding: 6px 0 8px; z-index: 1; }
.list-head h2 { font-family: var(--display); font-weight: 800; font-size: 1.4rem; margin: 0; }
.list-head .x { position: static; margin-left: auto; }
.list-note { color: var(--muted); font-size: .85rem; margin: 0 0 10px; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { font: inherit; color: var(--ink); text-align: left; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; width: 100%; background: var(--parch-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; cursor: pointer; }
.row:hover { border-color: var(--brass); }
.row:focus-visible { outline: 3px solid #FFD27A; outline-offset: 2px; }
.sw { width: 34px; height: 42px; border-radius: 3px; box-shadow: inset -4px 0 0 rgba(0,0,0,.25), 0 2px 4px rgba(0,0,0,.25); }
.row b { display: block; font-family: var(--display); font-weight: 800; font-size: 1rem; line-height: 1.15; }
.row small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.35; }
.meta { text-align: right; font-family: var(--mono); font-size: .74rem; color: var(--muted); white-space: nowrap; }
.meta .ub { display: inline-block; background: #FFE066; color: #3B2F00; font-family: var(--display); font-weight: 800; font-size: .66rem; padding: 1px 6px; border-radius: 4px; margin-top: 3px; }
.empty { color: var(--muted); padding: 14px 0; }
.loading { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: #140A04; color: #F2D9AE; font-family: var(--display); font-size: 1.1rem; transition: opacity .6s; }
.loading.done { opacity: 0; pointer-events: none; }
.fallback { max-width: 46ch; text-align: center; line-height: 1.5; padding: 20px; }
</style>
</head>

<div id="stage" aria-label="3D library of learning games"></div>

<header class="bar">

<script>

  ["facts", "Facts & terms"],
  ["process", "Steps & processes"],
  ["judgment", "Judgment calls"],
  ["trouble", "Finding problems"],
  ["tradeoffs", "Tradeoffs & priorities"],
  ["tools", "Hands-on tool skills"],
  ["concepts", "Big ideas & how things connect"],
  ["habits", "Habits & behavior change"]
];
const SETTINGS = [
  ["room", "Live, in the room"],
  ["call", "Live, on a video call"],
  ["self", "Self-paced, on their own"],
  ["community", "Ongoing in Slack or a community"],
  ["event", "Big event, 100+ people"],
  ["meeting", "10 minutes in a team meeting"]
];
const G = [
  {n:"Trivia Race", h:"Timed multiple-choice rounds. Faster correct answers score more, with a live leaderboard after each round.", c:["facts","concepts"], s:["call","room","event","meeting"], e:1, g:"5 to 1,000", t:"10–20 min",
   b:"Have Claude turn the source material into 15 questions with wrong answers that sound plausible, then build a one-page quiz with a timer.", f:"Make the last round worth double, or let teams bet points before each question.", w:"Rewards speed and recall. Use it to warm up a session, not to teach judgment."},
  {n:"Bingo", h:"Players mark squares as they hear, see, or do things. First full line wins.", c:["facts","habits","tools"], s:["event","call","community"], e:1, g:"10 to 3,000", t:"1 session or 1 week",
   b:"Give Claude 25 or more items and have it generate unique randomized cards.", f:"Run action bingo for a week, where each square is something to try at work, like drafting a reply with AI.", w:"Listening bingo during a talk can pull attention away from the talk."},
  {n:"Jeopardy Board", h:"Teams pick a category and point value, then answer. Harder questions are worth more.", c:["facts","concepts"], s:["call","room","meeting"], e:1, g:"2 to 6 teams", t:"20–30 min",
   b:"Give Claude your categories and have it write questions at five difficulty levels, then build a clickable board.", f:"Hide a Daily Double in the category people keep avoiding.", w:"Needs a host to keep it moving."},
  {n:"Board Race", h:"Players advance pieces across a board by completing learning challenges.", c:["facts","concepts","tools"], s:["self","room","community"], e:2, g:"1 to 100+", t:"Ongoing",
   b:"Use Claude Design for a 3D board and pieces, and have Claude build a challenge deck from the content.", f:"Add branching paths, shortcuts, and chance cards so no two runs play the same.", w:"If every square is the same quiz question, a new map is only a reskin."},
  {n:"Escape Room", h:"Solve a chain of locks. Each lock opens only when a step is done correctly.", c:["process","trouble","tools"], s:["self","call"], e:3, g:"1 to 5 per team", t:"30–45 min",

  {n:"Two Truths and a Lie", h:"Three statements, one false. Players vote on the lie, then hear why.", c:["facts","concepts"], s:["meeting","call","room","community"], e:1, g:"Any", t:"2–5 min",
   b:"Ask Claude for sets where the lie is a common misconception.", f:"Have participants write their own sets about the topic.", w:"Light. Best as an opener."},
  {n:"Quest Board", h:"Ongoing points, badges, and a leaderboard for real contributions in a community.", c:["habits","tools"], s:["community"], e:2, g:"50 to 1,000+", t:"Weeks to quarters",

  {n:"Prompt Golf", h:"Reach a target output in the fewest words or attempts. Each round is a new hole.", c:["tools"], s:["call","room","community","event"], e:1, g:"5 to 200", t:"15–30 min",

  {n:"Story Campaign", h:"A story told in weekly chapters. Each chapter's challenge moves the team's adventure forward.", c:["concepts","judgment","habits"], s:["community","meeting"], e:3, g:"Teams of 3 to 6", t:"4–8 weeks",
   b:"Have Claude draft a story arc where each chapter maps to one learning goal, then release a chapter a week.", f:"Let team choices change what happens in the next chapter.", w:"Needs steady weekly effort from you. Plan every chapter before launch."},
  {n:"Lightning Drill", h:"Rapid 60-second rounds of quick questions or shortcuts.", c:["facts","tools"], s:["meeting","call"], e:1, g:"Any", t:"5 min",
   b:"Have Claude write 20 one-line questions or shortcut drills.", f:"Track personal bests week over week.", w:"Only for things worth knowing by heart."},
  {n:"Defend the Decision", h:"Teams argue opposite sides of a realistic scenario. Judges score the reasoning.", c:["judgment","tradeoffs"], s:["room","call","meeting"], e:1, g:"6 to 40", t:"20 min",
   b:"Have Claude write scenarios with no obvious answer and a judging guide.", f:"Teams switch sides halfway through.", w:"Needs a good facilitator."},
  {n:"Build Sprint", h:"Teams build something real with the tools in a set time, then demo it.", c:["tools","habits"], s:["event","community","room"], e:2, g:"10 to 500", t:"2 hours to 2 days",
   b:"Have Claude write challenge briefs at three difficulty levels and a judging rubric.", f:"Give awards like most hours saved and most reusable.", w:"Beginners stall without setup help. Have helpers on hand."},
  {n:"Show-and-Tell Bounty", h:"Post bounties like 'show a workflow that does X.' People claim them by demoing.", c:["habits","tools"], s:["community","call"], e:1, g:"20 to 1,000", t:"Ongoing",
   b:"Have Claude draft bounty cards from your learning goals and post a few each week.", f:"Let members post their own bounties.", w:"Celebrate small entries too, or only experts will join."},
  {n:"Feature Auction", h:"Bid a limited currency on features, tools, or actions. True values are revealed after bidding.", c:["tradeoffs","concepts"], s:["room","call","event"], e:1, g:"6 to 100", t:"20 min",
   b:"Have Claude write 10 lots, each with a hidden true value and a reason.", f:"Reveal who overpaid and why.", w:"Fun but loud. Keep every lot tied to a learning goal."},
  {n:"Choose Your Path", h:"Learners pick a role path, and each path has its own quests.", c:["concepts","tools","habits"], s:["self","community"], e:2, g:"Any", t:"Self-paced",

  });

  const bm = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ map: bookTex, roughness: .55 }), books.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  books.forEach((b, i) => { q.setFromEuler(e.set(0, 0, b.rz)); m4.compose(new THREE.Vector3(b.x, b.y, b.z), q, new THREE.Vector3(b.w, b.h, b.d)); bm.setMatrixAt(i, m4); bm.setColorAt(i, new THREE.Color(b.color)); });
  bm.castShadow = bm.receiveShadow = true; room.add(bm);
  // keyboard path through the games, in shelf order
  const order = pickables.slice().sort((a, b) => (Math.round(b.userData.home.y / 40) - Math.round(a.userData.home.y / 40)) || 0);
  kbd.innerHTML = pickables.map((m, i) => `<button type="button" data-i="${i}">${esc(m.userData.g.n)}</button>`).join("");
}

// ---------- camera control ----------
const view = { x: bayX(0), y: 160, z: 330, tx: bayX(0), ty: 160, tz: 330 };
const LIM = { minX: -TOTAL / 2 + 60, maxX: TOTAL / 2 - 60, minZ: 70, maxZ: 560 };
function clampView() { const half = Math.tan(THREE.MathUtils.degToRad(20)) * (view.tz + 10) * camera.aspect; let lo = -TOTAL / 2 + half - 30, hi = TOTAL / 2 - half + 30; if (lo > hi) lo = hi = 0; view.tx = Math.max(lo, Math.min(hi, view.tx)); view.tz = Math.max(LIM.minZ, Math.min(LIM.maxZ, view.tz)); const span = (view.tz - 60) * .36; view.ty = Math.max(70 + span * .2, Math.min(260 - span * .2, view.ty)); }
const stage = $("stage"); const ptrs = new Map(); let dragMoved = 0, pinch0 = 0, z0 = 0;
stage.addEventListener("pointerdown", e => { stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); dragMoved = 0;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); z0 = view.tz; } stage.classList.add("dragging"); });
stage.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) { hover(e); return; }
  const p = ptrs.get(e.pointerId); const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; dragMoved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); if (pinch0) view.tz = z0 * pinch0 / d; }
  else { const s = view.z * .0016; view.tx -= dx * s; view.ty += dy * s; }
  clampView(); });
function endPtr(e) { if (ptrs.has(e.pointerId)) { ptrs.delete(e.pointerId); if (!ptrs.size) stage.classList.remove("dragging"); if (dragMoved < 6 && !ptrs.size) click(e); pinch0 = 0; } }
stage.addEventListener("pointerup", endPtr); stage.addEventListener("pointercancel", e => { ptrs.delete(e.pointerId); stage.classList.remove("dragging"); });
stage.addEventListener("wheel", e => { e.preventDefault(); view.tz *= Math.exp(e.deltaY * .0012); clampView(); }, { passive: false });
$("left").onclick = () => { view.tx -= 160; clampView(); }; $("right").onclick = () => { view.tx += 160; clampView(); };
$("zin").onclick = () => { view.tz *= .75; clampView(); }; $("zout").onclick = () => { view.tz /= .75; clampView(); };
addEventListener("keydown", e => { if (e.target.closest("input")) return; if (e.key !== "Escape" && e.target.closest(".list, .panel")) return;
  if (e.key === "ArrowLeft") { view.tx -= 60; clampView(); } if (e.key === "ArrowRight") { view.tx += 60; clampView(); }
  if (e.key === "ArrowUp") { view.ty += 30; clampView(); } if (e.key === "ArrowDown") { view.ty -= 30; clampView(); }
  if (e.key === "+" || e.key === "=") { view.tz *= .8; clampView(); } if (e.key === "-") { view.tz /= .8; clampView(); }
  if (e.key === "Escape") { if (!$("list").hidden) setList(false); else closePanel(); } });

// ---------- picking ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let hovered = null, opened = null;
function pick(e) { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera); const hit = ray.intersectObjects(pickables, false)[0]; return hit ? hit.object : null; }
function hover(e) { const m = pick(e); if (m !== hovered) { hovered = m; stage.classList.toggle("hovering", !!m); } }
function click(e) { const m = pick(e); if (m) openGame(m); }
function flyTo(m, z = 125) { view.tx = m.userData.home.x + (innerWidth > 640 && opened ? 30 : 0); view.ty = m.userData.home.y + 4; view.tz = z; clampView(); }
function openGame(m) {
  opened = m; flyTo(m); const g = m.userData.g;
  const ref = g.i ? `Inspired by ${esc(g.i)}` : g.r ? `Feels like ${esc(g.r[0])}` : "";
  const eff = ["", "Low", "Medium", "High"][g.e];
  $("pbody").innerHTML = `<h2 id="ptitle">${esc(g.n)}</h2>${ref ? `<span class="ref">${ref}</span>` : ""}
    <button type="button" class="used-btn" id="usedb" aria-pressed="${used.has(g.n)}">${used.has(g.n) ? "Used recently" : "Mark as used"}</button>
    <p>${esc(g.h)}</p><div class="tags">${g.a.map(k => `<span class="tag">${esc(FOCUS_AREAS.find(f => f[0] === k)[1])}</span>`).join("")}</div>
    <p class="ex"><span class="lbl">Example</span>${esc(g.x)}</p>
    <div class="stats"><div><span class="lbl">Build effort</span><span>${"●".repeat(g.e)}${"○".repeat(3 - g.e)} ${eff}</span></div><div><span class="lbl">Players</span><span>${esc(g.g)}</span></div><div><span class="lbl">Time</span><span>${esc(g.t)}</span></div></div>
    ${g.r ? `<p><span class="lbl">Borrow from ${esc(g.r[0])}</span>${esc(g.r[1])}</p>` : ""}
    <p><span class="lbl">Build it with Claude</span>${esc(g.b)}</p><p><span class="lbl">Keep it fresh</span>${esc(g.f)}</p>
    ${g.inc ? `<p><span class="lbl">Make it inclusive</span>${esc(g.inc)}</p>` : ""}<p><span class="lbl">Watch out</span>${esc(g.w)}</p>
    ${g.src && g.src.length ? `<p><span class="lbl">Seen in</span>${g.src.map(k => SRC[k] ? `<a href="${SRC[k][1]}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a>` : "").join(" · ")}</p>` : ""}`;
  $("panel").classList.add("open"); $("panel").focus({ preventScroll: true });
  $("usedb").onclick = async () => { used.has(g.n) ? used.delete(g.n) : used.add(g.n); try { localStorage.setItem("shelf-used", JSON.stringify([...used])); } catch (e) {}
    if (!m.userData.stack) { const c = await coverCanvas(g, look(g).shape); m.material[4].map.image = c; m.material[4].map.needsUpdate = true; dirty = true; } openGame(m); };
}
function closePanel() { if (!opened) return; const m = opened; opened = null; $("panel").classList.remove("open"); view.tz = Math.max(view.tz, 230); clampView(); const b = kbd.querySelector(`[data-i="${pickables.indexOf(m)}"]`); }
$("x").onclick = closePanel;
kbd.addEventListener("focusin", e => { const b = e.target.closest("button"); if (!b) return; const m = pickables[+b.dataset.i]; flyTo(m, 160); $("flabel").textContent = m.userData.g.n + " · press Enter to open"; $("flabel").style.display = "block"; });
kbd.addEventListener("focusout", () => { $("flabel").style.display = "none"; });
kbd.addEventListener("click", e => { const b = e.target.closest("button"); if (b) openGame(pickables[+b.dataset.i]); });

// ---------- filters ----------
const flt = { f: null, q: "" };
function matches(g) { const q = flt.q.trim().toLowerCase(); return (!flt.f || g.a.includes(flt.f)) && (!q || [g.n, g.i || "", g.r ? g.r.join(" ") : "", g.x, g.h].join(" ").toLowerCase().includes(q)); }
function chips() { $("chips").innerHTML = [["", "All"], ["lt", "Learn tech"], ["ls", "Learn sales"], ["it", "Implement tech"], ["is", "Implement sales"]].map(([k, l]) => `<button type="button" class="chip" data-k="${k}" aria-pressed="${(flt.f || "") === k}">${l}</button>`).join(""); }
function applyFilter() { let n = 0; dirty = true;
  pickables.forEach(m => { const ok = matches(m.userData.g); if (ok) n++; m.userData.dim = !ok; m.material.forEach(mm => mm.color.setScalar((ok ? 1 : .22) * (mm.toneMapped === false ? .92 : 1))); });
  $("count").textContent = `${n} of ${pickables.length} games`; chips(); if (!$("list").hidden) renderList(); }
$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; flt.f = b.dataset.k || null; applyFilter(); });
$("q").addEventListener("input", e => { flt.q = e.target.value; applyFilter(); });
$("surprise").onclick = () => { const pool = pickables.filter(m => !m.userData.dim && !used.has(m.userData.g.n)); const p = pool.length ? pool : pickables.filter(m => !m.userData.dim); if (p.length) openGame(p[Math.floor(Math.random() * p.length)]); };

// ---------- list view ----------
const FNAME = Object.fromEntries(FOCUS_AREAS);
function renderList() {
  const list = ordered.filter(matches);
  $("lcount").textContent = `${list.length} of ${ordered.length}`;
  $("listbody").innerHTML = list.length ? list.map(g => { const L = look(g); const ref = g.i ? `Inspired by ${g.i}` : g.r ? `Feels like ${g.r[0]}` : "";
    return `<button type="button" class="row" data-n="${esc(g.n)}"><span class="sw" style="background:linear-gradient(135deg, ${L.p[0]} 55%, ${L.p[1]})" aria-hidden="true"></span>
      <span><b>${esc(g.n)}</b><small>${esc(g.a.map(k => FNAME[k]).join(" · "))}${ref ? `<br>${esc(ref)}` : ""}</small></span>
      <span class="meta">${"●".repeat(g.e)}${"○".repeat(3 - g.e)}<br>${esc(g.t)}${used.has(g.n) ? `<br><span class="ub">USED</span>` : ""}</span></button>`; }).join("")
    : `<p class="empty">No games match. Try "All" or clear the search.</p>`;
}
function setList(open) { $("list").hidden = !open; $("listbtn").setAttribute("aria-pressed", String(open)); if (open) { renderList(); $("listx").focus(); } else $("listbtn").focus({ preventScroll: true }); }
$("listbtn").onclick = () => setList($("list").hidden);
$("listx").onclick = () => setList(false);
$("listbody").addEventListener("click", e => { const b = e.target.closest(".row"); if (!b) return; const m = gameMeshes.get(b.dataset.n); if (!m) return; $("list").hidden = true; $("listbtn").setAttribute("aria-pressed", "false"); openGame(m); });
$("reset").onclick = () => { closePanel(); hovered = null; view.tx = bayX(0); view.ty = 160; view.tz = 330; clampView(); dirty = true; };

// ---------- loop ----------
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches; const clock = new THREE.Clock();
let dirty = true;
window.__step = n => { for (let i = 0; i < n; i++) { dirty = true; frame(); } };
function frame() {
  const dt = window.__still ? .05 : Math.min(clock.getDelta(), .05), t = clock.elapsedTime, k = reduce ? 1 : 1 - Math.pow(.0025, dt);
  view.x += (view.tx - view.x) * k; view.y += (view.ty - view.y) * k; view.z += (view.tz - view.z) * k;
  camera.position.set(view.x, view.y + (view.z - 120) * .1, view.z); camera.lookAt(view.x, view.y, -10);
  key.position.set(view.x - 160, 420, 380); key.target.position.set(view.x, 120, 0);
  fill.position.set(view.x, 230, view.z + 60);
  rail.visible = view.z > 230;
  let moving = Math.abs(view.tx - view.x) + Math.abs(view.ty - view.y) + Math.abs(view.tz - view.z) > .05;
  for (const m of pickables) { const ud = m.userData; const out = m === opened ? 16 : m === hovered && !ud.dim ? 4 : ud.dim ? -8 : 0;
    const target = ud.home.z + out; if (Math.abs(target - m.position.z) > .02) moving = true; m.position.z += (target - m.position.z) * k; const ry = m === opened && !ud.stack ? Math.max(-.35, Math.min(.35, (view.x - ud.home.x) * .002)) : ud.rot; m.rotation.y += (ry - m.rotation.y) * k; }
  if (moving || dirty) { renderer.render(scene, camera); dirty = false; }
  if (!window.__still) requestAnimationFrame(frame);
}
addEventListener("resize", () => { dirty = true; renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

(async () => {
  const fams = [`800 20px "Bricolage Grotesque"`, `20px Bungee`, `20px "Alfa Slab One"`, `20px Righteous`, `20px "Lilita One"`, `900 20px Fraunces`, `500 10px "JetBrains Mono"`];
  try { await Promise.race([Promise.all(fams.map(f => document.fonts.load(f))), new Promise(r => setTimeout(r, 3500))]); } catch (e) {}
  await populate(); applyFilter();
  view.z = 640; view.y = 230; view.tz = 330; view.ty = 160; clampView(); view.x = view.tx;   // start wide on the whole bay, then glide in
  $("loading").classList.add("done"); frame();
  window.__ready = true;
})();
</script>
